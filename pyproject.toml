[project]
name = "stallwalk"
version = "0.1.0"
description = "Walk a market with a phone, get every stall's stock and prices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "pillow>=10",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
